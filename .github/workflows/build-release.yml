name: Build release

# Builds, signs, notarizes and verifies the Apple silicon release. Used by the
# release workflow.
on:
  workflow_call:
    inputs:
      version:
        description: X.Y.Z
        required: true
        type: string
      source:
        description: Commit to build
        required: true
        type: string
      build_number:
        description: Commit count the release was built from
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  LIBGHOSTTY_VT_SYS_OPTIMIZE: ReleaseFast
  MACOSX_DEPLOYMENT_TARGET: '14.0'

jobs:
  build:
    name: Build (${{ matrix.platform }}, ${{ matrix.arch }})
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-build-${{ matrix.target }}
      cancel-in-progress: false
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            directory: arm64
            arch: arm64
            target: aarch64-apple-darwin
            runner: macos-15
    env:
      VERSION: ${{ inputs.version }}
      BUILD_NUMBER: ${{ inputs.build_number }}
      NOTARIZE: ${{ secrets.APPLE_ID != '' && secrets.APPLE_APP_SPECIFIC_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
      ARCH: ${{ matrix.arch }}
      PACKAGE_DIR: target/packages/${{ inputs.version }}/${{ matrix.directory }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0
          targets: ${{ matrix.target }}
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          key: beta-${{ matrix.target }}-baseline
      - name: Stamp the build version without committing a bump
        run: |
          rm -rf target/packages
          python3 scripts/release.py stamp "$VERSION"
      - name: Import signing certificate
        if: runner.os == 'macOS'
        env:
          CERTIFICATE_P12: ${{ secrets.DEVELOPER_ID_APPLICATION_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/codesh-release-signing.keychain-db"
          : "${CERTIFICATE_P12:?Apple signing certificate is required}"
          : "${CERTIFICATE_PASSWORD:?Certificate password is required}"
          : "${KEYCHAIN_PASSWORD:?Keychain password is required}"
          umask 077
          CERTIFICATE="$RUNNER_TEMP/codesh-release-certificate.p12"
          trap 'rm -f "$CERTIFICATE"' EXIT
          printf '%s' "$CERTIFICATE_P12" | base64 --decode > "$CERTIFICATE"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" "$HOME/Library/Keychains/login.keychain-db"
          security import "$CERTIFICATE" -k "$KEYCHAIN_PATH" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
      - name: Resolve signing identity
        if: runner.os == 'macOS'
        id: identity
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/codesh-release-signing.keychain-db"
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | awk '/Developer ID Application:|Apple Development:/ {print $2; exit}')
          if [[ -z "$IDENTITY" ]]; then
            echo "Error: no Developer ID Application or Apple Development identity found" >&2
            exit 1
          fi
          echo "name=$IDENTITY" >> "$GITHUB_OUTPUT"
      - name: Build and sign desktop and standalone client/server pair
        if: runner.os == 'macOS'
        env:
          SIGN_IDENTITY: ${{ steps.identity.outputs.name }}
        run: >-
          bash scripts/build-release.sh --arch "$ARCH" --version "$VERSION"
          --build-number "$BUILD_NUMBER" --sign-identity "$SIGN_IDENTITY"
      - name: Notarize and verify DMG
        if: runner.os == 'macOS' && env.NOTARIZE == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash scripts/notarize-release.sh "$PACKAGE_DIR/Codesh-$VERSION-$ARCH.dmg"
      - name: Notarize standalone ZIP and verify extracted executables
        if: runner.os == 'macOS' && env.NOTARIZE == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash scripts/notarize-release.sh "$PACKAGE_DIR/codesh-$VERSION-macos-$ARCH.zip"
      - name: Verify packaged pair, desktop bytes and standalone installation
        if: runner.os == 'macOS'
        # The universal system Python runs as the packaged architecture, so the
        # x86_64 pair is installed and exercised under Rosetta.
        run: >-
          arch "-$ARCH" /usr/bin/python3 scripts/verify-release-package.py
          "$PACKAGE_DIR/codesh-$VERSION-macos-$ARCH.zip"
          --version "$VERSION" --dmg "$PACKAGE_DIR/Codesh-$VERSION-$ARCH.dmg"
          ${{ env.NOTARIZE == 'true' && '--notarized' || '' }}
      - name: Upload distribution archives
        uses: actions/upload-artifact@v4
        with:
          name: distribution-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            ${{ env.PACKAGE_DIR }}/Codesh-${{ env.VERSION }}-${{ matrix.arch }}.dmg
            ${{ env.PACKAGE_DIR }}/codesh-${{ env.VERSION }}-${{ matrix.platform }}-${{ matrix.arch }}.zip
          if-no-files-found: error
          retention-days: 7
      - name: Upload debug symbols and dependency audits
        uses: actions/upload-artifact@v4
        with:
          name: symbols-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            ${{ env.PACKAGE_DIR }}/*-symbols.zip
            ${{ env.PACKAGE_DIR }}/*-symbols.tar.gz
            ${{ env.PACKAGE_DIR }}/*-dependencies.txt
            ${{ env.PACKAGE_DIR }}/*-audit.txt
          if-no-files-found: error
          retention-days: 30
      - name: Keep packaged output out of the build cache
        if: always()
        run: rm -rf target/packages
      - name: Remove signing keychain
        if: always() && runner.os == 'macOS'
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/codesh-release-signing.keychain-db"
          if [[ -f "$KEYCHAIN_PATH" ]]; then
            security delete-keychain "$KEYCHAIN_PATH"
          fi
          rm -f "$RUNNER_TEMP/codesh-release-certificate.p12"
