name: Release

# Publishes every commit on main that passes CI as the latest release,
# X.Y.<commit count> with X.Y from VERSION. The latest release's update.json is
# the feed installed apps update from.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codesh-release
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      github.repository == 'hugocxl/codesh'
      && (github.event_name == 'workflow_dispatch'
        || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      source: ${{ steps.source.outputs.sha }}
      version: ${{ steps.version.outputs.version }}
      build_number: ${{ steps.version.outputs.build_number }}
    steps:
      - name: Release only from main
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          echo "Error: run Release on main, not ${GITHUB_REF#refs/heads/}" >&2
          exit 1
      - name: Resolve the commit CI passed
        id: source
        env:
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: echo "sha=$SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.sha }}
          fetch-depth: 0
      - name: Release only commits on main
        env:
          SOURCE: ${{ steps.source.outputs.sha }}
        run: |
          git fetch origin '+refs/heads/main:refs/remotes/origin/main'
          git merge-base --is-ancestor "$SOURCE" origin/main
      - name: Compute the version from VERSION and the commit count
        id: version
        run: python3 scripts/release.py version >> "$GITHUB_OUTPUT"
      - name: Reject a reused version from different history
        env:
          TAG: v${{ steps.version.outputs.version }}
          SOURCE: ${{ steps.source.outputs.sha }}
        run: |
          if git show-ref --verify --quiet "refs/tags/$TAG" \
            && [[ "$(git rev-parse "refs/tags/$TAG^{commit}")" != "$SOURCE" ]]; then
            echo "Error: $TAG already points to a different commit" >&2
            exit 1
          fi

  build:
    needs: prepare
    uses: ./.github/workflows/build-release.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      source: ${{ needs.prepare.outputs.source }}
      build_number: ${{ needs.prepare.outputs.build_number }}
    secrets: inherit

  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: distribution-*
          merge-multiple: true
          path: artifacts
      - name: Include the exact installer from this commit
        run: cp scripts/install-codesh.sh artifacts/
      - name: Publish the latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SOURCE: ${{ needs.prepare.outputs.source }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: bash scripts/publish-release.sh "$VERSION" artifacts
