[package]
name = "codesh-cli"
description = "Codesh command-line and terminal client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[[bin]]
name = "codesh"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
codesh-core = { path = "../codesh-core" }
codesh-protocol = { path = "../codesh-protocol" }
codesh-client = { path = "../codesh-client" }
codesh-app-core = { path = "../codesh-app-core" }
serde_json.workspace = true
serde = { version = "1.0", features = ["derive"] }
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm", "underline-color"] }
signal-hook = "0.4"
rustix = { version = "1.1.4", features = ["termios"] }

[target.'cfg(target_os = "linux")'.dependencies]
crossterm = { version = "0.29", features = ["use-dev-tty"] }

[dev-dependencies]
codesh-terminal = { path = "../codesh-terminal" }
tempfile = "3"
