[package]
name = "codesh-server"
description = "The Codesh server executable"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
regex = "1"
notify = "8"
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "ring"] }
ring = "0.17.14"
rustix = { version = "1.1.4", features = ["fs", "process", "system"] }
codesh-terminal = { path = "../codesh-terminal" }
getrandom = "0.3"
libc = "0.2"
postcard = { version = "1", default-features = false, features = ["use-std"] }
codesh-protocol = { path = "../codesh-protocol" }
serde_json.workspace = true
log = { version = "0.4", features = ["std"] }
codesh-core = { path = "../codesh-core" }
serde = { version = "1", features = ["derive"] }
signal-hook = "0.4"
toml = "1.1"


[target.'cfg(target_os = "macos")'.dependencies]
libproc = "0.14.11"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSData", "NSError", "NSFileManager", "NSLocale", "NSString", "NSURL"] }
